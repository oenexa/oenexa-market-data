groups:
  - name: oenexa-market-data-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oenexa-market-data\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oenexa-market-data instance is down\"
          description: \"Pod for oenexa-market-data has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oenexa-market-data\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oenexa-market-data\"